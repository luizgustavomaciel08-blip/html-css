<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linhas</h1>
    <hr>
    <p>Você pode escrever um parágrafo de qualquer jeito,<br> basta você colocar tudo entre as tags: <br> &lt;p&gt; e &lt;/p&gt; </p>
    <p>
        &reg;
        &copy;
        &trade;
        &euro;
        &Delta;
        &uparrow;
        &downarrow;
        &rightarrow;
    </p>
    <p>
        &#x2764;
        &#x1F440;
        &#x1F525;
        &#x1F499;
    </p>
</body>
</html>
