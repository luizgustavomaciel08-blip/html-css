<!DOCTYPE html>
<html lang="pt´br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            width: 400px;
            height: 400px;
            border-collapse: collapse;
        }

        

        td{
            border: 1px solid black;
            padding: 8px;
        }

        .dadoA{
            vertical-align: middle;
            text-align: left;
        }

        .dadoB{
            vertical-align: bottom;
            text-align: center;
        }

        .dadoC{
            vertical-align: middle;
            text-align: right;
        }
       
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <table>
        <tr>
            <td class="dadoA">A1</td>
            <td class="dadoB">B1</td>
            <td class="dadoC">C1</td>
        </tr>
        <tr>
            <td class="dadoA">A2</td>
            <td class="dadoB">B2</td>
            <td class="dadoC">C2</td>
        </tr>
        <tr>
            <td class="dadoA">A3</td>
            <td class="dadoB">B3</td>
            <td class="dadoC">C3</td>
        </tr>
        <tr>
            <td class="dadoA">A4</td>
            <td class="dadoB">B4</td>
            <td class="dadoC">C4</td>
        </tr>
    </table>
</body>
</html>
