<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        /*pseud-elementos são representados com :: */

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        a{
            color: red;
            text-decoration: none;
            font-weight: bold;
        }

        a:visited{
            color: darkred;
        }

        a:hover{
            color: black;
            text-decoration: underline;
        }

        a::after{
             content: ' [link] ';  
             text-decoration: none; 
             font-weight: normal;
             color: darkgrey;
        }
        
    </style>
</head>
<body>
    <h1>Personalizando Links</h1>
    <ul>
        <li><a href="https://www.youtube.com/" target="_blank">LINK 1</a></li>
        <li><a href="https://www.youtube.com/watch?v=PqTol6F1KiM&list=RDPqTol6F1KiM&start_radio=1" target="_blank">LINK 2</a></li>
        <li><a href="https://www.youtube.com/watch?v=JhXagtxvDKY&list=RDPqTol6F1KiM&index=7" target="_blank">LINK 3</a></li>
    </ul>
    
</body>
</html>
